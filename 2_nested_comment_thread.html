<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Nested Comment Thread</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.4/babel.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --surface: #171a21; --surface-hi: #1f232c; --border: #2a2f3a;
    --text: #e7e9ee; --text-dim: #9aa1ad; --accent: #5b8def; --danger: #e05a5a; --success: #4caf7d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #root { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .thread { border-left: none; }
  .comment { position: relative; margin-top: 10px; }
  .comment-inner {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px;
  }
  .comment.optimistic .comment-inner { opacity: 0.6; }
  .comment.failed .comment-inner { border-color: var(--danger); }
  .children { margin-left: 22px; padding-left: 14px; border-left: 2px solid var(--border); }
  .row-top { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; }
  .author { font-weight: 700; color: var(--text); }
  .time { color: var(--text-dim); }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--surface-hi); color: var(--text-dim); }
  .body-text { font-size: 13.5px; line-height: 1.4; white-space: pre-wrap; }
  .actions { display: flex; gap: 12px; margin-top: 6px; }
  .actions button {
    background: none; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer; padding: 0;
  }
  .actions button:hover { color: var(--accent); }
  .actions button.danger:hover { color: var(--danger); }
  .collapse-btn {
    background: var(--surface-hi); border: 1px solid var(--border); color: var(--text-dim);
    font-size: 11px; border-radius: 6px; padding: 1px 7px; cursor: pointer; margin-right: 6px;
  }
  .collapse-btn:hover { color: var(--text); }
  textarea, .edit-input {
    width: 100%; background: var(--surface-hi); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 13px; padding: 8px; font-family: inherit; resize: vertical; min-height: 50px;
  }
  .edit-actions { display: flex; gap: 8px; margin-top: 6px; }
  .btn { border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-ghost { background: var(--surface-hi); color: var(--text-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-line { font-size: 11px; color: var(--danger); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .error-line button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 11px; padding: 0; }
  .collapsed-summary { font-size: 12px; color: var(--text-dim); font-style: italic; margin-top: 4px; }
  .new-top-level { margin-top: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useCallback, useRef } = React;

let idCounter = 1000;
function mockRequest(shouldFailChance = 0.18) {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (Math.random() < shouldFailChance) reject(new Error("Request failed — server unavailable"));
      else resolve();
    }, 500 + Math.random() * 500);
  });
}

function timeAgo() { return "just now"; }

function seedTree() {
  return [
    {
      id: 1, author: "alice", text: "This library's diffing algorithm is way faster than I expected.",
      time: "2h ago", collapsed: false, children: [
        {
          id: 2, author: "bob", text: "Agreed — did you benchmark it against the old version?",
          time: "1h ago", collapsed: false, children: [
            { id: 3, author: "alice", text: "Yep, roughly 3x on large lists.", time: "45m ago", collapsed: false, children: [] },
          ],
        },
      ],
    },
    {
      id: 4, author: "carol", text: "Any plans to support keyboard navigation for reordering?",
      time: "3h ago", collapsed: false, children: [],
    },
  ];
}

function mapTree(nodes, id, fn) {
  return nodes.map((n) => {
    if (n.id === id) return fn(n);
    if (n.children.length) return { ...n, children: mapTree(n.children, id, fn) };
    return n;
  });
}
function removeFromTree(nodes, id) {
  return nodes
    .filter((n) => n.id !== id)
    .map((n) => (n.children.length ? { ...n, children: removeFromTree(n.children, id) } : n));
}
function insertChild(nodes, parentId, newNode) {
  if (parentId === null) return [...nodes, newNode];
  return nodes.map((n) => {
    if (n.id === parentId) return { ...n, children: [...n.children, newNode] };
    if (n.children.length) return { ...n, children: insertChild(n.children, parentId, newNode) };
    return n;
  });
}

function CommentComposer({ onSubmit, onCancel, autoFocus, placeholder, submitLabel, initialValue }) {
  const [value, setValue] = useState(initialValue || "");
  const ref = useRef(null);
  React.useEffect(() => { if (autoFocus && ref.current) ref.current.focus(); }, [autoFocus]);
  return (
    <div>
      <textarea
        ref={ref}
        className="edit-input"
        value={value}
        placeholder={placeholder}
        onChange={(e) => setValue(e.target.value)}
      />
      <div className="edit-actions">
        <button className="btn btn-primary" disabled={!value.trim()} onClick={() => onSubmit(value.trim())}>
          {submitLabel}
        </button>
        <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function CommentNode({ node, depth, onReply, onEdit, onDelete, onToggleCollapse, onRetry }) {
  const [replying, setReplying] = useState(false);
  const [editing, setEditing] = useState(false);
  const hasChildren = node.children && node.children.length > 0;

  return (
    <div className={"comment" + (node._pending ? " optimistic" : "") + (node._failed ? " failed" : "")}>
      <div className="comment-inner">
        <div className="row-top">
          {hasChildren && (
            <button className="collapse-btn" onClick={() => onToggleCollapse(node.id)}>
              {node.collapsed ? "+ " + countDescendants(node) : "−"}
            </button>
          )}
          <span className="author">{node.author}</span>
          <span className="time">{node.time}</span>
          {node._pending && <span className="badge">sending…</span>}
        </div>

        {!node.collapsed && (
          editing ? (
            <CommentComposer
              autoFocus
              initialValue={node.text}
              submitLabel="Save"
              onCancel={() => setEditing(false)}
              onSubmit={(text) => { onEdit(node.id, text); setEditing(false); }}
            />
          ) : (
            <>
              <div className="body-text">{node.text}</div>
              <div className="actions">
                <button onClick={() => setReplying((r) => !r)}>Reply</button>
                <button onClick={() => setEditing(true)}>Edit</button>
                <button className="danger" onClick={() => onDelete(node.id)}>Delete</button>
              </div>
            </>
          )
        )}

        {node._failed && (
          <div className="error-line">
            <span>{node._failed}</span>
            <button onClick={() => onRetry(node.id)}>Retry</button>
          </div>
        )}

        {!node.collapsed && replying && (
          <div style={{ marginTop: 8 }}>
            <CommentComposer
              autoFocus
              placeholder="Write a reply…"
              submitLabel="Reply"
              onCancel={() => setReplying(false)}
              onSubmit={(text) => { onReply(node.id, text); setReplying(false); }}
            />
          </div>
        )}

        {node.collapsed && hasChildren && (
          <div className="collapsed-summary">{countDescendants(node)} hidden replies</div>
        )}
      </div>

      {!node.collapsed && hasChildren && (
        <div className="children">
          {node.children.map((child) => (
            <CommentNode
              key={child.id}
              node={child}
              depth={depth + 1}
              onReply={onReply}
              onEdit={onEdit}
              onDelete={onDelete}
              onToggleCollapse={onToggleCollapse}
              onRetry={onRetry}
            />
          ))}
        </div>
      )}
    </div>
  );
}

function countDescendants(node) {
  let count = node.children.length;
  for (const c of node.children) count += countDescendants(c);
  return count;
}

function CommentThread() {
  const [tree, setTree] = useState(seedTree());
  const [composerOpen, setComposerOpen] = useState(false);

  const snapshotRef = useRef(tree);
  React.useEffect(() => { snapshotRef.current = tree; }, [tree]);

  const toggleCollapse = useCallback((id) => {
    setTree((t) => mapTree(t, id, (n) => ({ ...n, collapsed: !n.collapsed })));
  }, []);

  const handleReply = useCallback((parentId, text) => {
    const tempId = "temp-" + Math.random().toString(36).slice(2);
    const prevTree = snapshotRef.current;
    const newNode = {
      id: tempId, author: "you", text, time: "just now", collapsed: false, children: [], _pending: true,
    };
    setTree((t) => insertChild(t, parentId, newNode));

    mockRequest().then(
      () => {
        idCounter += 1;
        const realId = idCounter;
        setTree((t) => mapTree(t, tempId, (n) => ({ ...n, id: realId, _pending: false })));
      },
      (err) => {
        setTree((t) => mapTree(t, tempId, (n) => ({ ...n, _pending: false, _failed: err.message })));
      }
    );
  }, []);

  const handleEdit = useCallback((id, newText) => {
    let prevText;
    setTree((t) => {
      const capture = (nodes) => nodes.forEach((n) => {
        if (n.id === id) prevText = n.text;
        if (n.children.length) capture(n.children);
      });
      capture(t);
      return mapTree(t, id, (n) => ({ ...n, text: newText, _pending: true, _failed: null }));
    });

    mockRequest().then(
      () => setTree((t) => mapTree(t, id, (n) => ({ ...n, _pending: false }))),
      (err) => setTree((t) => mapTree(t, id, (n) => ({ ...n, text: prevText, _pending: false, _failed: "Edit failed, reverted: " + err.message })))
    );
  }, []);

  const handleDelete = useCallback((id) => {
    const prevTree = snapshotRef.current;
    setTree((t) => removeFromTree(t, id));

    mockRequest().then(
      () => {},
      (err) => {
        setTree(prevTree);
        alert("Delete failed and was rolled back: " + err.message);
      }
    );
  }, []);

  const handleRetryFailedReply = useCallback((tempId) => {
    let text, parentFound = null;
    const findAndRemove = (nodes, parentId) => nodes
      .filter((n) => {
        if (n.id === tempId) { text = n.text; parentFound = parentId; return false; }
        return true;
      })
      .map((n) => n.children.length ? { ...n, children: findAndRemove(n.children, n.id) } : n);

    setTree((t) => {
      const cleaned = findAndRemove(t, null);
      return cleaned;
    });
    setTimeout(() => { if (text !== undefined) handleReply(parentFound, text); }, 0);
  }, [handleReply]);

  const handleNewTopLevel = useCallback((text) => {
    handleReply(null, text);
    setComposerOpen(false);
  }, [handleReply]);

  return (
    <div>
      <h1>Nested Comment Thread</h1>
      <div className="sub">Optimistic add / edit / delete — ~18% of mock requests randomly fail to demonstrate rollback.</div>

      <div className="thread">
        {tree.map((node) => (
          <CommentNode
            key={node.id}
            node={node}
            depth={0}
            onReply={handleReply}
            onEdit={handleEdit}
            onDelete={handleDelete}
            onToggleCollapse={toggleCollapse}
            onRetry={handleRetryFailedReply}
          />
        ))}
      </div>

      <div className="new-top-level">
        {composerOpen ? (
          <CommentComposer
            autoFocus
            placeholder="Add a comment…"
            submitLabel="Post"
            onCancel={() => setComposerOpen(false)}
            onSubmit={handleNewTopLevel}
          />
        ) : (
          <button className="btn btn-primary" onClick={() => setComposerOpen(true)}>Add comment</button>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CommentThread />);
</script>
</body>
</html>
