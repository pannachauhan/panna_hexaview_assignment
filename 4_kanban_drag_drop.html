<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kanban Board — Drag & Drop</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.4/babel.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --surface: #171a21; --surface-hi: #1f232c; --border: #2a2f3a;
    --text: #e7e9ee; --text-dim: #9aa1ad; --accent: #5b8def; --danger: #e05a5a; --success: #4caf7d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #root { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 8px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  .btn { border: none; border-radius: 7px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; background: var(--surface-hi); color: var(--text); }
  .btn:hover:not(:disabled) { background: var(--accent); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .kbd-hint { font-size: 11.5px; color: var(--text-dim); }
  .board { display: flex; gap: 14px; align-items: flex-start; }
  .column {
    flex: 1; min-width: 220px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; min-height: 320px;
  }
  .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
  .column-title { font-size: 13.5px; font-weight: 700; }
  .count-badge { font-size: 11px; color: var(--text-dim); background: var(--surface-hi); padding: 1px 7px; border-radius: 999px; }
  .card-list { min-height: 40px; }
  .card {
    background: var(--surface-hi); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 10px; margin-bottom: 8px; font-size: 13px; cursor: grab; user-select: none;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.35; }
  .card:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .card .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px; margin-top: 6px; background: rgba(91,141,239,0.15); color: var(--accent); }
  .drop-indicator {
    height: 3px; background: var(--accent); border-radius: 2px; margin: -6px 0 5px; transition: none;
  }
  .column.drag-over { border-color: var(--accent); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useCallback, useRef, useEffect } = React;

function seedBoard() {
  return {
    columnOrder: ["todo", "inprogress", "review", "done"],
    columns: {
      todo: { id: "todo", title: "To Do", cardIds: ["c1", "c2", "c3"] },
      inprogress: { id: "inprogress", title: "In Progress", cardIds: ["c4"] },
      review: { id: "review", title: "In Review", cardIds: ["c5"] },
      done: { id: "done", title: "Done", cardIds: ["c6"] },
    },
    cards: {
      c1: { id: "c1", text: "Set up CI pipeline", tag: "DevOps" },
      c2: { id: "c2", text: "Design mandate creation form", tag: "UI" },
      c3: { id: "c3", text: "Write API contract for debit posting", tag: "Backend" },
      c4: { id: "c4", text: "Implement Redis cache-aside layer", tag: "Backend" },
      c5: { id: "c5", text: "Review NPCI XML validation logic", tag: "Review" },
      c6: { id: "c6", text: "Migrate SQL indexes to new schema", tag: "Done" },
    },
  };
}

function moveCard(board, cardId, fromColId, toColId, toIndex) {
  const fromCol = board.columns[fromColId];
  const toCol = board.columns[toColId];
  const fromIds = fromCol.cardIds.filter((id) => id !== cardId);

  let toIds;
  if (fromColId === toColId) {
    toIds = [...fromIds];
    toIds.splice(toIndex, 0, cardId);
  } else {
    toIds = [...toCol.cardIds];
    toIds.splice(toIndex, 0, cardId);
  }

  return {
    ...board,
    columns: {
      ...board.columns,
      [fromColId]: { ...fromCol, cardIds: fromColId === toColId ? toIds : fromIds },
      [toColId]: { ...toCol, cardIds: toIds },
    },
  };
}

function KanbanBoard() {
  const [board, setBoard] = useState(seedBoard());
  const [undoStack, setUndoStack] = useState([]);
  const [redoStack, setRedoStack] = useState([]);
  const [draggingCardId, setDraggingCardId] = useState(null);
  const [dragOverInfo, setDragOverInfo] = useState(null);
  const [focusedCardId, setFocusedCardId] = useState(null);

  const commitMove = useCallback((cardId, fromColId, toColId, toIndex) => {
    setBoard((prevBoard) => {
      const fromCol = prevBoard.columns[fromColId];
      const currentIndex = fromCol.cardIds.indexOf(cardId);
      if (fromColId === toColId && (toIndex === currentIndex || toIndex === currentIndex + 1)) {
        return prevBoard;
      }
      setUndoStack((s) => [...s, prevBoard]);
      setRedoStack([]);
      return moveCard(prevBoard, cardId, fromColId, toColId, toIndex);
    });
  }, []);

  const undo = useCallback(() => {
    setUndoStack((stack) => {
      if (stack.length === 0) return stack;
      const prev = stack[stack.length - 1];
      setBoard((current) => {
        setRedoStack((r) => [...r, current]);
        return prev;
      });
      return stack.slice(0, -1);
    });
  }, []);

  const redo = useCallback(() => {
    setRedoStack((stack) => {
      if (stack.length === 0) return stack;
      const next = stack[stack.length - 1];
      setBoard((current) => {
        setUndoStack((u) => [...u, current]);
        return next;
      });
      return stack.slice(0, -1);
    });
  }, []);

  useEffect(() => {
    const handler = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
        e.preventDefault();
        redo();
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [undo, redo]);

  const handleDragStart = (e, cardId, colId) => {
    setDraggingCardId(cardId);
    e.dataTransfer.setData("text/plain", JSON.stringify({ cardId, fromColId: colId }));
    e.dataTransfer.effectAllowed = "move";
  };

  const handleDragEnd = () => {
    setDraggingCardId(null);
    setDragOverInfo(null);
  };

  const handleDragOverColumn = (e, colId) => {
    e.preventDefault();
    const list = e.currentTarget;
    const cardEls = Array.from(list.querySelectorAll("[data-card-id]"));
    const mouseY = e.clientY;

    let index = cardEls.length;
    for (let i = 0; i < cardEls.length; i++) {
      const rect = cardEls[i].getBoundingClientRect();
      const midpoint = rect.top + rect.height / 2;
      if (mouseY < midpoint) { index = i; break; }
    }
    setDragOverInfo({ colId, index });
  };

  const handleDrop = (e, toColId) => {
    e.preventDefault();
    let payload;
    try { payload = JSON.parse(e.dataTransfer.getData("text/plain")); } catch { return; }
    if (!payload) return;
    const { cardId, fromColId } = payload;
    const index = dragOverInfo && dragOverInfo.colId === toColId ? dragOverInfo.index : board.columns[toColId].cardIds.length;
    commitMove(cardId, fromColId, toColId, index);
    setDraggingCardId(null);
    setDragOverInfo(null);
  };

  const handleCardKeyDown = (e, cardId, colId) => {
    const col = board.columns[colId];
    const idx = col.cardIds.indexOf(cardId);
    const colOrder = board.columnOrder;
    const colPos = colOrder.indexOf(colId);

    if (e.key === "ArrowUp" && idx > 0) {
      e.preventDefault();
      commitMove(cardId, colId, colId, idx - 1);
    } else if (e.key === "ArrowDown" && idx < col.cardIds.length - 1) {
      e.preventDefault();
      commitMove(cardId, colId, colId, idx + 2);
    } else if (e.key === "ArrowLeft" && colPos > 0) {
      e.preventDefault();
      const targetCol = colOrder[colPos - 1];
      commitMove(cardId, colId, targetCol, board.columns[targetCol].cardIds.length);
      setFocusedCardId(cardId);
    } else if (e.key === "ArrowRight" && colPos < colOrder.length - 1) {
      e.preventDefault();
      const targetCol = colOrder[colPos + 1];
      commitMove(cardId, colId, targetCol, board.columns[targetCol].cardIds.length);
      setFocusedCardId(cardId);
    }
  };

  const cardRefs = useRef({});
  useEffect(() => {
    if (focusedCardId && cardRefs.current[focusedCardId]) {
      cardRefs.current[focusedCardId].focus();
    }
  }, [board, focusedCardId]);

  return (
    <div>
      <h1>Kanban Board</h1>
      <div className="sub">Drag cards, or focus a card and use Arrow keys to move it. Ctrl/Cmd+Z to undo, Ctrl/Cmd+Shift+Z (or Ctrl+Y) to redo.</div>
      <div className="toolbar">
        <button className="btn" onClick={undo} disabled={undoStack.length === 0}>↶ Undo</button>
        <button className="btn" onClick={redo} disabled={redoStack.length === 0}>↷ Redo</button>
        <span className="kbd-hint">{undoStack.length} move(s) in history</span>
      </div>

      <div className="board">
        {board.columnOrder.map((colId) => {
          const col = board.columns[colId];
          const isDragOverThisCol = dragOverInfo && dragOverInfo.colId === colId;
          return (
            <div
              key={colId}
              className={"column" + (isDragOverThisCol ? " drag-over" : "")}
              onDragOver={(e) => handleDragOverColumn(e, colId)}
              onDrop={(e) => handleDrop(e, colId)}
            >
              <div className="column-header">
                <span className="column-title">{col.title}</span>
                <span className="count-badge">{col.cardIds.length}</span>
              </div>
              <div className="card-list">
                {col.cardIds.map((cardId, index) => {
                  const card = board.cards[cardId];
                  const showIndicatorBefore = isDragOverThisCol && dragOverInfo.index === index;
                  return (
                    <React.Fragment key={cardId}>
                      {showIndicatorBefore && <div className="drop-indicator" />}
                      <div
                        ref={(el) => { cardRefs.current[cardId] = el; }}
                        data-card-id={cardId}
                        className={"card" + (draggingCardId === cardId ? " dragging" : "")}
                        draggable
                        tabIndex={0}
                        role="button"
                        aria-label={"Card: " + card.text + ". Use arrow keys to move."}
                        onDragStart={(e) => handleDragStart(e, cardId, colId)}
                        onDragEnd={handleDragEnd}
                        onKeyDown={(e) => handleCardKeyDown(e, cardId, colId)}
                      >
                        {card.text}
                        <div className="tag">{card.tag}</div>
                      </div>
                    </React.Fragment>
                  );
                })}
                {isDragOverThisCol && dragOverInfo.index === col.cardIds.length && (
                  <div className="drop-indicator" />
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KanbanBoard />);
</script>
</body>
</html>
