<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Multi-Step Form Wizard</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.4/babel.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --surface: #171a21; --surface-hi: #1f232c; --border: #2a2f3a;
    --text: #e7e9ee; --text-dim: #9aa1ad; --accent: #5b8def; --danger: #e05a5a; --success: #4caf7d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #root { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .steps { display: flex; gap: 6px; margin-bottom: 22px; }
  .step-pill {
    flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; font-size: 11.5px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); cursor: default;
  }
  .step-pill.done { color: var(--success); border-color: var(--success); cursor: pointer; }
  .step-pill.active { color: var(--text); border-color: var(--accent); background: var(--surface-hi); }
  .step-pill .n { display: block; font-size: 10px; opacity: 0.7; margin-bottom: 2px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 5px; }
  input[type=text], input[type=email], input[type=number], select, textarea {
    width: 100%; background: var(--surface-hi); border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); font-size: 13.5px; padding: 9px 10px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .field.error input, .field.error select, .field.error textarea { border-color: var(--danger); }
  .err-msg { font-size: 11.5px; color: var(--danger); margin-top: 4px; }
  .radio-group { display: flex; gap: 14px; margin-top: 2px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
  .nav-row { display: flex; justify-content: space-between; margin-top: 22px; }
  .btn { border: none; border-radius: 7px; padding: 9px 18px; font-size: 13px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-ghost { background: var(--surface-hi); color: var(--text-dim); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .review-item { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .review-item span:first-child { color: var(--text-dim); }
  .cross-error { background: rgba(224,90,90,0.12); border: 1px solid var(--danger); color: #ff9a9a; font-size: 12.5px; padding: 8px 10px; border-radius: 7px; margin-bottom: 14px; }
  .saved-note { font-size: 11px; color: var(--text-dim); text-align: right; margin-top: 8px; }
  .success-box { text-align: center; padding: 40px 20px; }
  .success-box .check { font-size: 40px; color: var(--success); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useCallback } = React;

const STORAGE_KEY = "wizard-draft-v1";

const STEP_DEFS = [
  { key: "account", label: "Account" },
  { key: "employment", label: "Employment" },
  { key: "billing", label: "Billing" },
  { key: "review", label: "Review" },
];

const initialData = {
  fullName: "", email: "",
  employmentStatus: "", companyName: "", annualIncome: "",
  planType: "", cardNumber: "", billingCycle: "monthly",
};

function validateStep(stepKey, data) {
  const errors = {};
  if (stepKey === "account") {
    if (!data.fullName.trim()) errors.fullName = "Full name is required.";
    if (!data.email.trim()) errors.email = "Email is required.";
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) errors.email = "Enter a valid email address.";
  }
  if (stepKey === "employment") {
    if (!data.employmentStatus) errors.employmentStatus = "Please select your employment status.";
    if (data.employmentStatus === "employed") {
      if (!data.companyName.trim()) errors.companyName = "Company name is required when employed.";
      if (!data.annualIncome) errors.annualIncome = "Annual income is required when employed.";
      else if (Number(data.annualIncome) < 0) errors.annualIncome = "Income can't be negative.";
    }
  }
  if (stepKey === "billing") {
    if (!data.planType) errors.planType = "Choose a plan.";
    if (data.planType === "paid" && !data.cardNumber.trim()) errors.cardNumber = "Card number is required for paid plans.";
    if (data.planType === "paid" && data.cardNumber && !/^\d{16}$/.test(data.cardNumber.replace(/\s/g, ""))) {
      errors.cardNumber = "Card number must be 16 digits.";
    }
  }
  return errors;
}

function validateCrossStep(data) {
  const errors = [];
  if (data.planType === "paid" && data.employmentStatus === "unemployed") {
    errors.push("A paid plan requires an employment status other than unemployed — go back to Employment or choose the free plan.");
  }
  if (data.employmentStatus === "employed" && Number(data.annualIncome) < 15000 && data.planType === "paid") {
    errors.push("Paid plans require an annual income of at least $15,000 given your employment status.");
  }
  return errors;
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

function Wizard() {
  const draft = useMemo(loadDraft, []);
  const [data, setData] = useState(draft?.data || initialData);
  const [stepIndex, setStepIndex] = useState(draft?.stepIndex || 0);
  const [completedSteps, setCompletedSteps] = useState(new Set(draft?.completedSteps || []));
  const [errors, setErrors] = useState({});
  const [crossErrors, setCrossErrors] = useState([]);
  const [submitted, setSubmitted] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);

  useEffect(() => {
    const payload = { data, stepIndex, completedSteps: Array.from(completedSteps) };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    setLastSaved(new Date());
  }, [data, stepIndex, completedSteps]);

  const currentStepKey = STEP_DEFS[stepIndex].key;

  const updateField = (field, value) => {
    setData((d) => ({ ...d, [field]: value }));
    if (errors[field]) setErrors((e) => ({ ...e, [field]: undefined }));
  };

  const goNext = () => {
    if (currentStepKey === "review") return;
    const stepErrors = validateStep(currentStepKey, data);
    setErrors(stepErrors);
    if (Object.keys(stepErrors).length > 0) return;
    setCompletedSteps((s) => new Set(s).add(currentStepKey));
    setStepIndex((i) => Math.min(i + 1, STEP_DEFS.length - 1));
  };

  const goBack = () => setStepIndex((i) => Math.max(i - 1, 0));

  const jumpToStep = (idx) => {
    const targetKey = STEP_DEFS[idx].key;
    if (completedSteps.has(targetKey) || idx === stepIndex || idx < stepIndex) {
      setStepIndex(idx);
    }
  };

  const handleSubmit = () => {
    const stepErrors = validateStep(currentStepKey, data);
    setErrors(stepErrors);
    if (Object.keys(stepErrors).length > 0) return;
    const cross = validateCrossStep(data);
    setCrossErrors(cross);
    if (cross.length > 0) return;

    setSubmitted(true);
    localStorage.removeItem(STORAGE_KEY);
  };

  if (submitted) {
    return (
      <div className="card success-box">
        <div className="check">✓</div>
        <h1>Application submitted</h1>
        <div className="sub">Thanks, {data.fullName.split(" ")[0] || "there"} — your draft has been cleared.</div>
      </div>
    );
  }

  return (
    <div>
      <h1>Account Setup Wizard</h1>
      <div className="sub">Progress is saved automatically — refresh the page any time.</div>

      <div className="steps">
        {STEP_DEFS.map((s, idx) => {
          const isDone = completedSteps.has(s.key);
          const isActive = idx === stepIndex;
          return (
            <div
              key={s.key}
              className={"step-pill" + (isDone ? " done" : "") + (isActive ? " active" : "")}
              onClick={() => jumpToStep(idx)}
            >
              <span className="n">Step {idx + 1}</span>
              {s.label}{isDone ? " ✓" : ""}
            </div>
          );
        })}
      </div>

      <div className="card">
        {crossErrors.length > 0 && (
          <div className="cross-error">
            {crossErrors.map((e, i) => <div key={i}>{e}</div>)}
          </div>
        )}

        {currentStepKey === "account" && (
          <>
            <div className={"field" + (errors.fullName ? " error" : "")}>
              <label>Full name</label>
              <input type="text" value={data.fullName} onChange={(e) => updateField("fullName", e.target.value)} />
              {errors.fullName && <div className="err-msg">{errors.fullName}</div>}
            </div>
            <div className={"field" + (errors.email ? " error" : "")}>
              <label>Email</label>
              <input type="email" value={data.email} onChange={(e) => updateField("email", e.target.value)} />
              {errors.email && <div className="err-msg">{errors.email}</div>}
            </div>
          </>
        )}

        {currentStepKey === "employment" && (
          <>
            <div className={"field" + (errors.employmentStatus ? " error" : "")}>
              <label>Employment status</label>
              <select value={data.employmentStatus} onChange={(e) => updateField("employmentStatus", e.target.value)}>
                <option value="">Select…</option>
                <option value="employed">Employed</option>
                <option value="self-employed">Self-employed</option>
                <option value="unemployed">Unemployed</option>
                <option value="student">Student</option>
              </select>
              {errors.employmentStatus && <div className="err-msg">{errors.employmentStatus}</div>}
            </div>

            {data.employmentStatus === "employed" && (
              <>
                <div className={"field" + (errors.companyName ? " error" : "")}>
                  <label>Company name</label>
                  <input type="text" value={data.companyName} onChange={(e) => updateField("companyName", e.target.value)} />
                  {errors.companyName && <div className="err-msg">{errors.companyName}</div>}
                </div>
                <div className={"field" + (errors.annualIncome ? " error" : "")}>
                  <label>Annual income (USD)</label>
                  <input type="number" value={data.annualIncome} onChange={(e) => updateField("annualIncome", e.target.value)} />
                  {errors.annualIncome && <div className="err-msg">{errors.annualIncome}</div>}
                </div>
              </>
            )}
          </>
        )}

        {currentStepKey === "billing" && (
          <>
            <div className={"field" + (errors.planType ? " error" : "")}>
              <label>Plan</label>
              <div className="radio-group">
                <label><input type="radio" name="plan" checked={data.planType === "free"} onChange={() => updateField("planType", "free")} /> Free</label>
                <label><input type="radio" name="plan" checked={data.planType === "paid"} onChange={() => updateField("planType", "paid")} /> Paid</label>
              </div>
              {errors.planType && <div className="err-msg">{errors.planType}</div>}
            </div>

            {data.planType === "paid" && (
              <div className={"field" + (errors.cardNumber ? " error" : "")}>
                <label>Card number</label>
                <input type="text" placeholder="16 digits" value={data.cardNumber} onChange={(e) => updateField("cardNumber", e.target.value)} />
                {errors.cardNumber && <div className="err-msg">{errors.cardNumber}</div>}
              </div>
            )}
          </>
        )}

        {currentStepKey === "review" && (
          <>
            <div className="review-item"><span>Full name</span><span>{data.fullName}</span></div>
            <div className="review-item"><span>Email</span><span>{data.email}</span></div>
            <div className="review-item"><span>Employment</span><span>{data.employmentStatus}</span></div>
            {data.employmentStatus === "employed" && (
              <>
                <div className="review-item"><span>Company</span><span>{data.companyName}</span></div>
                <div className="review-item"><span>Annual income</span><span>${data.annualIncome}</span></div>
              </>
            )}
            <div className="review-item"><span>Plan</span><span>{data.planType}</span></div>
            {data.planType === "paid" && (
              <div className="review-item"><span>Card</span><span>•••• {data.cardNumber.slice(-4)}</span></div>
            )}
          </>
        )}

        <div className="nav-row">
          <button className="btn btn-ghost" onClick={goBack} disabled={stepIndex === 0}>Back</button>
          {currentStepKey === "review" ? (
            <button className="btn btn-primary" onClick={handleSubmit}>Submit application</button>
          ) : (
            <button className="btn btn-primary" onClick={goNext}>Next</button>
          )}
        </div>
      </div>

      {lastSaved && <div className="saved-note">Draft saved {lastSaved.toLocaleTimeString()}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Wizard />);
</script>
</body>
</html>
